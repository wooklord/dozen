<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Dozen — Eggy setlist reader</title>
    <meta
      name="description"
      content="A fast, mobile-first reader for The Carton's Eggy setlist archive. Gap charts, rotation, recent setlists and jam charts."
    />
    <!-- Two media-scoped theme-colors so the browser chrome follows the OS in
         Auto mode. app.js overrides these when an explicit theme is chosen. -->
    <meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf6ef" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <!-- iOS ignores the manifest's maskable purpose and applies its own
         squircle mask, so this points at a square full-bleed asset rather than
         the padded maskable one -- otherwise the mark floats small inside it. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />
    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/app.css" />
    <script>
      // Stamp the saved theme BEFORE first paint. src/app.js is a module and
      // therefore deferred, so doing this there would flash the default
      // palette first -- which is exactly the jarring thing an explicit theme
      // choice is meant to prevent. Mirrors src/theme.js; kept tiny and
      // dependency-free on purpose.
      try {
        var t = localStorage.getItem('dozen.theme.v1');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          var m = document.createElement('meta');
          m.id = 'theme-color-explicit';
          m.name = 'theme-color';
          m.content = t === 'light' ? '#faf6ef' : '#14110e';
          document.head.appendChild(m);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="app-header">
      <!-- No header mark, deliberately.
           A 3x2 mark showed six cells for an app called The Dozen, which
           contradicts the name. The honest 4x3 and 6x2 alternatives both
           collapse into texture at the ~21px the header can spare, the same
           failure the carton grid hit in the tab bar. The wordmark already
           states the name and the full dozen lives on the app icon, where
           there is room for it, so nothing is lost and nothing miscounts. -->
      <h1 class="app-title"><span class="the">The</span> Dozen</h1>
      <div class="header-status" id="header-status"></div>
    </header>

    <main class="app-main" id="main">
      <div class="loader">
        <div class="carton">
          <div class="carton-cell"></div><div class="carton-cell"></div>
          <div class="carton-cell"></div><div class="carton-cell"></div>
          <div class="carton-cell"></div><div class="carton-cell"></div>
          <div class="carton-cell"></div><div class="carton-cell"></div>
          <div class="carton-cell"></div><div class="carton-cell"></div>
          <div class="carton-cell"></div><div class="carton-cell"></div>
        </div>
        <div class="loader-label">Starting up…</div>
      </div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>

    <noscript>
      <!-- Tokens, not literals: hardcoded hex here would stay dark-mode
           coloured on a light background. -->
      <p style="padding: 24px; color: var(--ink-dim)">
        The Dozen needs JavaScript. All setlist data comes from
        <a href="https://thecarton.net" style="color: var(--yolk)">The Carton</a>.
      </p>
    </noscript>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>

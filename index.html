<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Dozen — Eggy setlist reader</title>
    <meta
      name="description"
      content="A fast, mobile-first reader for The Carton's Eggy setlist archive. Gap charts, rotation, recent setlists and jam charts."
    />
    <!-- Two media-scoped theme-colors so the browser chrome follows the OS in
         Auto mode. app.js overrides these when an explicit theme is chosen. -->
    <!-- BUILD in the SERVED HTML, so a deploy can be verified with a plain
         fetch and no browser. src/version.js remains the single source of
         truth; tests/build.test.mjs fails if these two ever drift apart. -->
    <meta name="dozen-build" content="0.1.51" />
    <meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf6ef" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <!-- iOS ignores the manifest's maskable purpose and applies its own
         squircle mask, so this points at a square full-bleed asset rather than
         the padded maskable one -- otherwise the mark floats small inside it. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />
    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/app.css" />
    <script>
      // Stamp the saved theme BEFORE first paint. src/app.js is a module and
      // therefore deferred, so doing this there would flash the default
      // palette first -- which is exactly the jarring thing an explicit theme
      // choice is meant to prevent. Mirrors src/theme.js; kept tiny and
      // dependency-free on purpose.
      try {
        var t = localStorage.getItem('dozen.theme.v1');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          var m = document.createElement('meta');
          m.id = 'theme-color-explicit';
          m.name = 'theme-color';
          m.content = t === 'light' ? '#faf6ef' : '#14110e';
          document.head.appendChild(m);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="app-header">
      <div class="app-brand">
        <!-- A full dozen: 6x2, the flat carton strip.
             Six cells would contradict the name, and earlier attempts failed
             only because the BUILD chip left ~9px of headroom. With BUILD moved
             into the Settings sheet the header has 198px for a 146px brand, so
             twelve cells get 11px of pitch and stay individually countable.
             `currentColor` so it follows --yolk into the light theme. -->
        <svg class="app-mark" viewBox="0 0 384 128" aria-hidden="true" focusable="false">
          <ellipse cx="32" cy="32" rx="24" ry="26" />
          <ellipse cx="96" cy="32" rx="24" ry="26" />
          <ellipse cx="160" cy="32" rx="24" ry="26" />
          <ellipse cx="224" cy="32" rx="24" ry="26" />
          <ellipse cx="288" cy="32" rx="24" ry="26" />
          <ellipse cx="352" cy="32" rx="24" ry="26" />
          <ellipse cx="32" cy="96" rx="24" ry="26" />
          <ellipse cx="96" cy="96" rx="24" ry="26" />
          <ellipse cx="160" cy="96" rx="24" ry="26" />
          <ellipse cx="224" cy="96" rx="24" ry="26" />
          <ellipse cx="288" cy="96" rx="24" ry="26" />
          <ellipse cx="352" cy="96" rx="24" ry="26" />
        </svg>
        <h1 class="app-title"><span class="the">The</span> Dozen</h1>
      </div>
      <div class="header-status" id="header-status"></div>
    </header>

    <main class="app-main" id="main">
      <div class="loader">
        <div class="carton">
          <div class="carton-cell"></div><div class="carton-cell"></div>
          <div class="carton-cell"></div><div class="carton-cell"></div>
          <div class="carton-cell"></div><div class="carton-cell"></div>
          <div class="carton-cell"></div><div class="carton-cell"></div>
          <div class="carton-cell"></div><div class="carton-cell"></div>
          <div class="carton-cell"></div><div class="carton-cell"></div>
        </div>
        <div class="loader-label">Starting up…</div>
      </div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>

    <noscript>
      <!-- Tokens, not literals: hardcoded hex here would stay dark-mode
           coloured on a light background. -->
      <p style="padding: 24px; color: var(--ink-dim)">
        The Dozen needs JavaScript. All setlist data comes from
        <a href="https://thecarton.net" style="color: var(--yolk)">The Carton</a>.
      </p>
    </noscript>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
